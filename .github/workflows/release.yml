name: Release Build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARY_NAME: ArtnetMonitor

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Compile cache: the Synology (WebDAV) when this runner can reach it
      # (self-hosted, home LAN), otherwise GitHub's Actions cache. Probed
      # once: sccache fails the *build*, not just the cache, when its backend
      # is unreachable, so the wrapper is only armed if a backend answered.
      - name: Enable sccache
        shell: bash
        env:
          SCCACHE_WEBDAV_ENDPOINT: ${{ secrets.SCCACHE_WEBDAV_ENDPOINT }}
          SCCACHE_WEBDAV_USERNAME: ${{ secrets.SCCACHE_WEBDAV_USERNAME }}
          SCCACHE_WEBDAV_PASSWORD: ${{ secrets.SCCACHE_WEBDAV_PASSWORD }}
        run: |
          sccache --stop-server >/dev/null 2>&1 || true
          if [ -n "$SCCACHE_WEBDAV_ENDPOINT" ] && sccache --start-server >/dev/null 2>&1; then
            {
              echo "RUSTC_WRAPPER=sccache"
              echo "SCCACHE_WEBDAV_ENDPOINT=$SCCACHE_WEBDAV_ENDPOINT"
              echo "SCCACHE_WEBDAV_USERNAME=$SCCACHE_WEBDAV_USERNAME"
              echo "SCCACHE_WEBDAV_PASSWORD=$SCCACHE_WEBDAV_PASSWORD"
              echo "CARGO_INCREMENTAL=0"
            } >> "$GITHUB_ENV"
            echo "sccache: WebDAV cache"
          else
            sccache --stop-server >/dev/null 2>&1 || true
            if env -u SCCACHE_WEBDAV_ENDPOINT -u SCCACHE_WEBDAV_USERNAME -u SCCACHE_WEBDAV_PASSWORD \
                 SCCACHE_GHA_ENABLED=true sccache --start-server >/dev/null 2>&1; then
              {
                echo "RUSTC_WRAPPER=sccache"
                echo "SCCACHE_GHA_ENABLED=true"
                echo "CARGO_INCREMENTAL=0"
              } >> "$GITHUB_ENV"
              echo "sccache: GitHub Actions cache"
            else
              echo "::warning::no sccache backend reachable; building without cache"
            fi
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${BINARY_NAME} dist/
          cd dist
          zip -9 ${BINARY_NAME}-macos-x64.zip ${BINARY_NAME}

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${BINARY_NAME} dist/
          cd dist
          zip -9 ${BINARY_NAME}-linux-x64.zip ${BINARY_NAME}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/$env:BINARY_NAME.exe" "dist/"
          Compress-Archive -Path "dist/$env:BINARY_NAME.exe" -DestinationPath "dist/$env:BINARY_NAME-windows-x64.zip" -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
